<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>THE RANGE — Practice</title>
  </head>
  <body>
    <!-- WebGL canvas (filled by the renderer) -->
    <canvas id="app"></canvas>

    <!-- HUD layer: pointer-events:none, built dynamically by ui/HUD.js -->
    <div id="hud" aria-hidden="true"></div>

    <!-- Overlay/menu layer: pointer-events:auto when shown, built by ui/Overlay.js -->
    <div id="overlay"></div>

    <!-- Portrait nudge (mobile only; CSS-shown in touch-mode + portrait) -->
    <div id="rotate-hint"><div class="rh-icon">⟳</div>Rotate your device to landscape</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
